<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DjChat | Join Room</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family: "Inter", sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        background: radial-gradient(
            circle at 20% 20%,
            rgba(99, 102, 241, 0.18),
            transparent 35%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(139, 92, 246, 0.18),
            transparent 35%
          ),
          #0f172a;

        color: #f8fafc;
      }

      .wrapper {
        width: 100%;
        max-width: 460px;
      }

      .brand {
        text-align: center;
        margin-bottom: 30px;
      }

      .brand-icon {
        width: 68px;
        height: 68px;

        margin: 0 auto 18px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 20px;

        background: linear-gradient(135deg, #6366f1, #8b5cf6);

        font-size: 30px;

        box-shadow: 0 15px 35px rgba(99, 102, 241, 0.35);
      }

      .brand h1 {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -1px;
      }

      .brand p {
        margin-top: 8px;
        color: #94a3b8;
        font-size: 14px;
      }

      .card {
        background: rgba(30, 41, 59, 0.88);

        border: 1px solid rgba(148, 163, 184, 0.12);

        border-radius: 24px;

        padding: 32px;

        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);

        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
      }

      .card-header {
        margin-bottom: 25px;
      }

      .card-header h2 {
        font-size: 20px;
        font-weight: 700;
      }

      .card-header p {
        margin-top: 7px;
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.6;
      }

      .form-group {
        margin-bottom: 18px;
      }

      .form-group label {
        display: block;

        margin-bottom: 8px;

        color: #cbd5e1;

        font-size: 13px;
        font-weight: 600;
      }

      .form-group input {
        width: 100%;

        padding: 14px 16px;

        border: 1px solid #334155;

        border-radius: 12px;

        background: #0f172a;

        color: #f8fafc;

        font-family: inherit;
        font-size: 14px;

        outline: none;

        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .form-group input::placeholder {
        color: #64748b;
      }

      .form-group input:focus {
        border-color: #6366f1;

        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      }

      .submit-button {
        width: 100%;

        border: none;

        padding: 15px;

        margin-top: 5px;

        border-radius: 12px;

        background: linear-gradient(135deg, #6366f1, #8b5cf6);

        color: white;

        font-family: inherit;

        font-size: 14px;
        font-weight: 700;

        cursor: pointer;

        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .submit-button:hover {
        transform: translateY(-2px);

        box-shadow: 0 12px 25px rgba(99, 102, 241, 0.3);
      }

      .submit-button:active {
        transform: translateY(0);
      }

      .footer {
        text-align: center;

        margin-top: 25px;

        color: #64748b;

        font-size: 12px;
      }

      @media (max-width: 500px) {
        .card {
          padding: 24px;
        }

        .brand h1 {
          font-size: 29px;
        }
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <div class="brand">
        <div class="brand-icon">💬</div>

        <h1>DjChat</h1>

        <p>Simple conversations. Real-time communication.</p>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Join a chat room</h2>

          <p>Enter a room name and choose your username to start chatting.</p>
        </div>

        <form id="post-form" method="POST" action="{% url 'checkview' %}">
          {% csrf_token %}

          <div class="form-group">
            <label for="room_name">Room name</label>

            <input
              type="text"
              name="room_name"
              id="room_name"
              placeholder="e.g. developers"
              autocomplete="off"
              required
            />
          </div>

          <div class="form-group">
            <label for="username">Username</label>

            <input
              type="text"
              name="username"
              id="username"
              placeholder="Enter your username"
              autocomplete="off"
              required
            />
          </div>

          <button type="submit" class="submit-button">Enter Room →</button>
        </form>
      </div>

      <div class="footer">Built with Django</div>
    </div>
  </body>
</html>
