<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{ room }} | DjChat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;

        overflow: hidden;

        font-family: "Inter", sans-serif;

        background: #0f172a;

        color: #f8fafc;
      }

      /* =========================
         APP
      ========================= */

      .chat-app {
        height: 100vh;

        display: flex;
        flex-direction: column;

        max-width: 1100px;

        margin: 0 auto;

        background: #111827;

        box-shadow: 0 0 80px rgba(0, 0, 0, 0.35);
      }

      /* =========================
         HEADER
      ========================= */

      .chat-header {
        height: 75px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        padding: 0 25px;

        background: #1e293b;

        border-bottom: 1px solid #334155;

        flex-shrink: 0;
      }

      .room-info {
        display: flex;

        align-items: center;

        gap: 13px;
      }

      .room-icon {
        width: 42px;
        height: 42px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 12px;

        background: linear-gradient(135deg, #6366f1, #8b5cf6);

        font-size: 19px;
      }

      .room-details h1 {
        font-size: 15px;

        font-weight: 700;
      }

      .room-details span {
        display: flex;

        align-items: center;

        gap: 6px;

        margin-top: 4px;

        color: #94a3b8;

        font-size: 11px;
      }

      .online-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #22c55e;

        box-shadow: 0 0 8px rgba(34, 197, 94, 0.7);
      }

      .user-badge {
        display: flex;

        align-items: center;

        gap: 9px;

        padding: 8px 12px;

        border-radius: 10px;

        background: #0f172a;

        color: #cbd5e1;

        font-size: 12px;
      }

      .user-avatar {
        width: 28px;
        height: 28px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: #6366f1;

        color: white;

        font-size: 11px;

        font-weight: 700;
      }

      /* =========================
         MESSAGES
      ========================= */

      #display {
        flex: 1;

        overflow-y: auto;

        padding: 30px;

        display: flex;

        flex-direction: column;

        gap: 15px;

        background: radial-gradient(
            circle at 20% 20%,
            rgba(99, 102, 241, 0.04),
            transparent 30%
          ),
          #111827;
      }

      #display::-webkit-scrollbar {
        width: 6px;
      }

      #display::-webkit-scrollbar-track {
        background: transparent;
      }

      #display::-webkit-scrollbar-thumb {
        background: #334155;

        border-radius: 10px;
      }

      .message {
        max-width: 75%;

        padding: 13px 16px;

        border-radius: 16px;

        background: #1e293b;

        border: 1px solid #334155;

        align-self: flex-start;

        animation: messageIn 0.2s ease;
      }

      .message.me {
        align-self: flex-end;

        background: linear-gradient(135deg, #6366f1, #7c3aed);

        border-color: transparent;
      }

      .message-user {
        margin-bottom: 5px;

        color: #a5b4fc;

        font-size: 11px;

        font-weight: 700;
      }

      .message.me .message-user {
        color: rgba(255, 255, 255, 0.75);
      }

      .message-text {
        color: #e2e8f0;

        font-size: 14px;

        line-height: 1.6;

        word-break: break-word;
      }

      .message.me .message-text {
        color: white;
      }

      .message-time {
        display: block;

        margin-top: 7px;

        color: #64748b;

        font-size: 10px;

        text-align: right;
      }

      .message.me .message-time {
        color: rgba(255, 255, 255, 0.6);
      }

      @keyframes messageIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* =========================
         INPUT AREA
      ========================= */

      .input-area {
        padding: 18px 25px;

        background: #1e293b;

        border-top: 1px solid #334155;

        flex-shrink: 0;
      }

      #post-form {
        display: flex;

        gap: 10px;
      }

      #message {
        flex: 1;

        min-width: 0;

        padding: 14px 17px;

        border: 1px solid #334155;

        border-radius: 13px;

        outline: none;

        background: #0f172a;

        color: #f8fafc;

        font-family: inherit;

        font-size: 14px;

        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      #message::placeholder {
        color: #64748b;
      }

      #message:focus {
        border-color: #6366f1;

        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
      }

      .send-button {
        width: 52px;

        border: none;

        border-radius: 13px;

        background: linear-gradient(135deg, #6366f1, #8b5cf6);

        color: white;

        font-size: 18px;

        cursor: pointer;

        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .send-button:hover {
        transform: translateY(-2px);

        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
      }

      .send-button:active {
        transform: translateY(0);
      }

      /* =========================
         MOBILE
      ========================= */

      @media (max-width: 600px) {
        .chat-header {
          height: 68px;

          padding: 0 15px;
        }

        .room-icon {
          width: 38px;
          height: 38px;
        }

        .user-badge {
          padding: 6px;
        }

        .user-badge span {
          display: none;
        }

        #display {
          padding: 20px 15px;
        }

        .message {
          max-width: 85%;
        }

        .input-area {
          padding: 12px 15px;
        }
      }
    </style>
  </head>

  <body>
    <div class="chat-app">
      <!-- =========================
           HEADER
      ========================== -->

      <header class="chat-header">
        <div class="room-info">
          <div class="room-icon">💬</div>

          <div class="room-details">
            <h1>{{ room }}</h1>

            <span>
              <span class="online-dot"></span>
              Chat room
            </span>
          </div>
        </div>

        <div class="user-badge">
          <div class="user-avatar">{{ username|first|upper }}</div>

          <span> {{ username }} </span>
        </div>
      </header>

      <!-- =========================
           MESSAGES
      ========================== -->

      <div id="display"></div>

      <!-- =========================
           MESSAGE INPUT
      ========================== -->

      <div class="input-area">
        <form id="post-form">
          {% csrf_token %}

          <input
            type="hidden"
            name="username"
            id="username"
            value="{{ username }}"
          />

          <input
            type="hidden"
            name="room_id"
            id="room_id"
            value="{{ room_details.id }}"
          />

          <input
            type="text"
            name="message"
            id="message"
            placeholder="Write a message..."
            autocomplete="off"
            maxlength="10000"
            required
          />

          <button type="submit" class="send-button" title="Send message">
            ➤
          </button>
        </form>
      </div>
    </div>

    <script>
      function loadMessages() {
        $.ajax({
          type: "GET",
          url: "{% url 'getMessages' room=room %}",

          success: function (response) {
            const display = $("#display");

            display.empty();

            for (let key in response.messages) {
              const message = response.messages[key];

              const isMe = message.user === $("#username").val();

              const messageClass = isMe ? "message me" : "message";

              const temp = `
                <div class="${messageClass}">
                  <div class="message-user">
                    ${escapeHtml(message.user)}
                  </div>
    
                  <div class="message-text">
                    ${escapeHtml(message.value)}
                  </div>
    
                  <span class="message-time">
                    ${escapeHtml(message.date)}
                  </span>
                </div>
              `;

              display.append(temp);
            }

            display.scrollTop(display[0].scrollHeight);
          },

          error: function () {
            console.error("Could not load messages.");
          },
        });
      }

      function escapeHtml(text) {
        return $("<div>").text(text).html();
      }

      $(document).ready(function () {
        loadMessages();

        setInterval(loadMessages, 1000);
      });

      $(document).on("submit", "#post-form", function (e) {
        e.preventDefault();

        const messageInput = $("#message");

        const message = messageInput.val().trim();

        if (!message) {
          return;
        }

        $.ajax({
          type: "POST",

          url: "{% url 'send' %}",

          data: {
            username: $("#username").val(),
            room_id: $("#room_id").val(),
            message: message,
            csrfmiddlewaretoken: $("input[name=csrfmiddlewaretoken]").val(),
          },

          success: function () {
            messageInput.val("");

            messageInput.focus();

            loadMessages();
          },

          error: function () {
            alert("Could not send your message.");
          },
        });
      });
    </script>
  </body>
</html>
